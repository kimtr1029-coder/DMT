      .prop { fill:#f5f8ff; stroke:#2459d3; stroke-width:2.8; stroke-dasharray:9 6; }
      .mini { fill:#ffffff; stroke:#2459d3; stroke-width:1.8; }
      .data { fill:none; stroke:#17191d; stroke-width:2.7; marker-end:url(#arrB); }
      .wire { fill:none; stroke:#17191d; stroke-width:2.2; }
      .ctrl { fill:none; stroke:#2459d3; stroke-width:2.7; marker-end:url(#arrBlue); }
      .icon { fill:none; stroke:#17191d; stroke-width:1.75; stroke-linecap:round; stroke-linejoin:round; }
      .blueicon { fill:none; stroke:#2459d3; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
      .title { font-size:27px; font-weight:700; }
      .label { font-size:18px; font-weight:700; }
      .sig { font-size:16px; font-style:italic; }
      .tiny { font-size:14px; }
      .blue { fill:#2459d3; }
