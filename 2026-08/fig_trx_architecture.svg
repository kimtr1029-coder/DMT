    <linearGradient id="panelShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#fafafa"/>
    </linearGradient>
    <style>
      text { font-family: "Nimbus Sans", Arial, Helvetica, sans-serif; fill:#17191d; }
      .panel { fill:url(#panelShade); stroke:#17191d; stroke-width:2.6; }
      .channel { fill:#ffffff; stroke:#777d86; stroke-width:2.2; }
      .blk { fill:#f4f5f7; stroke:#17191d; stroke-width:2.1; }
